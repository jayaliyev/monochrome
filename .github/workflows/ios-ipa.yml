name: Build iOS IPA (unsigned)

on:
    workflow_dispatch:
    push:
        branches: [ios-build]

permissions:
    contents: read

jobs:
    build-ipa:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Select latest stable Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Install dependencies
              run: |
                  bun install
                  bun add -d "@capacitor/cli@$(node -p "require('@capacitor/ios/package.json').version")"

            - name: Build IPA
              env:
                  BUILD_NUMBER: ${{ github.run_number }}
              run: bash scripts/ios/build-ipa.sh

            - name: Upload IPA
              uses: actions/upload-artifact@v4
              with:
                  name: monochrome-ios-unsigned-ipa
                  path: build-ios/*.ipa
                  if-no-files-found: error
                  retention-days: 30

    # Runs the app in the iOS Simulator (real iOS WebKit) and records screenshots of a scripted session:
    # search, play a track, full-screen player, library, settings, menu.
    simulator-test:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Select latest stable Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Install dependencies
              run: |
                  bun install
                  bun add -d "@capacitor/cli@$(node -p "require('@capacitor/ios/package.json').version")"

            - name: Run in iOS Simulator
              env:
                  IOS_TEST: ${{ vars.IOS_TEST || '1' }}
                  DURATION: ${{ vars.SIM_DURATION || '150' }}
              run: bash scripts/ios/simulator-test.sh

            - name: Upload simulator screenshots and logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: simulator-session
                  path: |
                      build-ios/sim-shots
                      build-ios/sim-log.txt
                      build-ios/sim-info.txt
                  if-no-files-found: warn
                  retention-days: 14
