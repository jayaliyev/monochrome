name: Build iOS IPA (unsigned)

on:
    workflow_dispatch:
    push:
        branches: [ios-build]

permissions:
    contents: read

jobs:
    build-ipa:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Select latest stable Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Install dependencies
              run: |
                  bun install
                  bun add -d "@capacitor/cli@$(node -p "require('@capacitor/ios/package.json').version")"

            - name: Build IPA
              env:
                  BUILD_NUMBER: ${{ github.run_number }}
              run: bash scripts/ios/build-ipa.sh

            - name: Upload IPA
              uses: actions/upload-artifact@v4
              with:
                  name: monochrome-ios-unsigned-ipa
                  path: build-ios/*.ipa
                  if-no-files-found: error
                  retention-days: 30
